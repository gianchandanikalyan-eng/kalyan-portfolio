<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalyan Gianchandani</title>
<meta name="description" content="Kalyan Gianchandani: final-year MBA at SCMHRD, Pune. Architect by training. Consulting, strategy and B2B sales.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#141113;color:#f4eef0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.035em}
.wrap{max-width:1080px;margin:0 auto;padding:0 40px}
.nav{position:sticky;top:0;z-index:30;width:100%;background:rgba(20,17,19,.78);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.08)}
.nav .wrap{padding-top:10px;padding-bottom:10px}
.nav .nl{padding:8px 16px;border-radius:999px;transition:background .25s,color .2s}
.nav .nl:hover{background:rgba(255,255,255,.08)}
.nav .non{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.08)}
@supports (animation-timeline: scroll()){@keyframes navTone{from{background:rgba(20,17,19,.62)}to{background:rgba(20,17,19,.86)}}.nav{animation:navTone linear both;animation-timeline:scroll();animation-range:0 200px}}
.ftic{transition:background .2s,color .2s,border-color .2s}.ftic:hover{background:#74b9f0!important;color:#141113!important;border-color:#74b9f0!important}
.nav .non{background:linear-gradient(90deg,rgba(20,24,40,.22) 0%,rgba(116,185,240,.08) 50%,rgba(255,255,255,.18) 100%);backdrop-filter:blur(2px) saturate(170%) brightness(1.25);-webkit-backdrop-filter:blur(2px) saturate(170%) brightness(1.25);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1.5px 1px -1px rgba(255,255,255,.75),inset 0 -2px 2px -1px rgba(255,255,255,.6),inset -4px 0 4px -3px rgba(255,255,255,.55),inset 4px 0 5px -4px rgba(255,255,255,.22),inset 0 0 10px rgba(116,185,240,.12)}
.nav .nl:hover{background:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(255,255,255,.12)}
.ghost,.tag,.skill,.vtag,.dur,.copy,.ftcv,.etag{backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.07),0 3px 10px rgba(0,0,0,.4)}
.ghost{background:linear-gradient(90deg,rgba(20,24,40,.22) 0%,rgba(116,185,240,.08) 50%,rgba(255,255,255,.18) 100%);backdrop-filter:blur(2px) saturate(170%) brightness(1.25);-webkit-backdrop-filter:blur(2px) saturate(170%) brightness(1.25);border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 2px 1px -1px rgba(255,255,255,.8),inset 0 -3px 3px -2px rgba(255,255,255,.7),inset -6px 0 6px -4px rgba(255,255,255,.6),inset 6px 0 8px -5px rgba(255,255,255,.25),inset 0 0 14px rgba(116,185,240,.14),0 6px 18px rgba(0,0,0,.3)!important}
.ftcv{background:linear-gradient(90deg,rgba(20,24,40,.22) 0%,rgba(116,185,240,.08) 50%,rgba(255,255,255,.18) 100%);backdrop-filter:blur(2px) saturate(170%) brightness(1.25);-webkit-backdrop-filter:blur(2px) saturate(170%) brightness(1.25);border:1px solid rgba(116,185,240,.55);box-shadow:inset 0 2px 1px -1px rgba(255,255,255,.8),inset 0 -3px 3px -2px rgba(255,255,255,.7),inset -6px 0 6px -4px rgba(255,255,255,.6),inset 6px 0 8px -5px rgba(255,255,255,.25),inset 0 0 14px rgba(116,185,240,.14),0 6px 18px rgba(0,0,0,.3)}
.pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -2px 0 rgba(0,0,0,.18),0 4px 12px rgba(116,185,240,.15)}
.pill2{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.2),0 4px 12px rgba(232,51,106,.15)}
.ft{margin-top:48px;border-top:1px solid #2c262a;background:linear-gradient(180deg,#141113,#171315)}
.ftgrid{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:32px;padding:56px 0 40px}
.fth{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#93898e;margin-bottom:12px}
.ftl{display:block;font-size:14px;color:#d8cfd3;padding:5px 0;transition:color .2s}
.ftl:hover{color:#74b9f0}
.ftp{font-size:14px;color:#93898e;margin:14px 0 18px;max-width:340px;line-height:1.55}
.ftcv{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#74b9f0;border:1px solid rgba(116,185,240,.45);padding:11px 22px;border-radius:980px;transition:background .2s,color .2s}
.ftcv:hover{background:#74b9f0;color:#141113}
.ftbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 0 30px;border-top:1px solid #2c262a;font-size:12px;color:#8f868b}
@media (max-width:860px){.ftgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nl{font-size:13px;color:#a89ea3;padding:16px 8px;transition:color .2s}
.nl:hover{color:#ffffff}
.non{font-size:13px;color:#ffffff;padding:16px 8px}
.muted{color:#93898e}
.pill{display:inline-flex;align-items:center;gap:8px;background:#74b9f0;color:#141113;padding:14px 30px;border-radius:980px;font-size:16px;font-weight:600;transition:box-shadow .3s, transform .2s;box-shadow:0 4px 12px rgba(116,185,240,.15)}
.pill:hover{color:#141113;transform:scale(1.02);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 6px 16px rgba(116,185,240,.25)}
.ghost{display:inline-flex;align-items:center;gap:8px;border:1px solid #4a4146;color:#f4eef0;padding:14px 30px;border-radius:980px;font-size:16px;font-weight:500;transition:border-color .3s, color .3s}
.ghost:hover{border-color:#74b9f0;color:#74b9f0}
.link{color:#74b9f0;font-size:16px}
.link:hover{color:#74b9f0;text-decoration:underline}
.kicker{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#74b9f0}

.card{display:block;background:#1c181b;border:1px solid #2c262a;border-radius:28px;overflow:hidden;transition:transform .5s cubic-bezier(.16,1,.3,1), border-color .4s, box-shadow .4s}
.card:hover{transform:translateY(-6px);border-color:rgba(116,185,240,.45);box-shadow:0 24px 60px rgba(116,185,240,.08)}
.cover{position:relative;height:250px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:22px 24px}
.cover .chip{align-self:flex-start;position:relative;z-index:2;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px}
.cover .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform 1.2s cubic-bezier(.16,1,.3,1)}
.card:hover .cover .bg{transform:scale(1.06)}
.cover .fade{position:absolute;inset:0}
.cover .brand{position:relative;z-index:2;line-height:.95;transition:transform .6s cubic-bezier(.16,1,.3,1)}
.card:hover .cover .brand{transform:translateY(-4px)}
.shape{position:absolute;z-index:1;transition:transform 1s cubic-bezier(.16,1,.3,1)}
.card:hover .shape{transform:scale(1.08) rotate(-4deg)}

.track{overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;margin-top:34px;padding-bottom:18px;scrollbar-width:thin;scrollbar-color:#3a3236 transparent}
.lane{display:flex;gap:20px;padding:0 max(40px, calc((100% - 1000px) / 2));width:max-content;position:relative}
.lane:before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:linear-gradient(90deg,rgba(116,185,240,0),rgba(116,185,240,.55) 15%,rgba(232,51,106,.55) 85%,rgba(232,51,106,0))}
.job{flex:0 0 350px;scroll-snap-align:start;display:flex;flex-direction:column;gap:18px}
.tl{display:flex;align-items:center;gap:12px;height:20px}
.node{width:20px;height:20px;border-radius:50%;background:#141113;border:2px solid #74b9f0;box-shadow:0 0 14px rgba(116,185,240,.7);position:relative;z-index:1}
.tdate{font-size:13px;font-weight:600;color:#74b9f0;letter-spacing:.02em}
.jcard{flex:1;background:linear-gradient(180deg,#1f1a1d,#1a1619);border:1px solid #2c262a;border-radius:24px;padding:26px;transition:border-color .4s, transform .5s cubic-bezier(.16,1,.3,1), box-shadow .4s}
.jcard:hover{border-color:rgba(116,185,240,.5);transform:translateY(-4px);box-shadow:0 20px 50px rgba(116,185,240,.08)}
.logo{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:8px 12px;border-radius:12px}
.logo img{height:34px;width:auto;max-width:150px;object-fit:contain;display:block}
.dur{font-size:12px;font-weight:600;color:#ffb3c6;background:rgba(232,51,106,.14);border:1px solid rgba(232,51,106,.35);padding:5px 13px;border-radius:999px;white-space:nowrap}
.dates{font-size:14px;font-weight:600;color:#74b9f0;margin-top:20px;letter-spacing:.01em}
.arw{width:48px;height:48px;border-radius:50%;border:1px solid #3a3236;background:#1a1619;color:#f4eef0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
.arw:hover{border-color:#74b9f0;color:#74b9f0;box-shadow:0 0 18px rgba(116,185,240,.35)}

.ecard{display:flex;flex-direction:column;background:linear-gradient(180deg,#1f1a1d,#1a1619);border:1px solid #2c262a;border-radius:24px;padding:26px;transition:border-color .4s, transform .5s cubic-bezier(.16,1,.3,1)}
.ecard:hover{border-color:rgba(116,185,240,.5);transform:translateY(-4px)}
.emb{width:72px;height:72px;border-radius:16px;background:#ffffff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.emb img{width:100%;height:100%;object-fit:contain;display:block}
.etag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 13px;border-radius:999px}

.jcta{position:relative;overflow:hidden;display:block;background:linear-gradient(180deg,#1f1a1d,#1a1619);border:1px solid #2c262a;border-radius:32px;padding:44px;transition:border-color .4s, transform .5s cubic-bezier(.16,1,.3,1)}
.jcta:hover{border-color:rgba(116,185,240,.5);transform:translateY(-4px)}
.jlogo{position:relative;z-index:1;width:46px;height:46px;border-radius:12px;background:#ffffff;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #141113}
.jlogo img{width:100%;height:100%;object-fit:contain;display:block}
.do{display:flex;flex-direction:column;justify-content:space-between;background:#1f1a1d;border-radius:28px;padding:36px 32px;min-height:280px;transition:transform .5s cubic-bezier(.16,1,.3,1), background .3s}
.do:hover{transform:translateY(-6px);background:#262024}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(116,185,240,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(116,185,240,.07) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#141113 30%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#141113 30%,transparent 75%);pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@supports (animation-timeline: view()){
  .reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 22%}
}
@media (max-width:860px){.wrap{padding:0 16px}.g3,.g2{grid-template-columns:1fr !important}.h1{font-size:40px !important}.h2{font-size:38px !important}.lede{font-size:19px !important}}

/* ---- design system pass ---- */
.navin{display:flex;justify-content:space-between;align-items:center;gap:12px}
.nlinks{display:flex;gap:6px;align-items:center}
.navcv{margin-left:10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#74b9f0;padding:7px 15px;border-radius:999px;border:1px solid rgba(116,185,240,.55);background:linear-gradient(90deg,rgba(20,24,40,.22) 0%,rgba(116,185,240,.08) 50%,rgba(255,255,255,.18) 100%);box-shadow:inset 0 1.5px 1px -1px rgba(255,255,255,.75),inset 0 -2px 2px -1px rgba(255,255,255,.6),inset -4px 0 4px -3px rgba(255,255,255,.55),inset 4px 0 5px -4px rgba(255,255,255,.22),inset 0 0 10px rgba(116,185,240,.12)}
.navcv:hover{color:#141113;background:#74b9f0}
.mnav{display:none}
.mnav summary{list-style:none;cursor:pointer;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#f4eef0;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
.mnav summary::-webkit-details-marker{display:none}
.mnav .ic-x{display:none}.mnav[open] .ic-x{display:block}.mnav[open] .ic-m{display:none}
.mpanel{position:absolute;left:0;right:0;top:100%;height:calc(100vh - 64px);height:calc(100dvh - 64px);background:#141113;padding:12px 20px 32px;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,.08);overflow-y:auto}
.mpanel a{font-size:24px;font-weight:700;letter-spacing:-.02em;padding:16px 4px;color:#a89ea3;border-bottom:1px solid #2c262a}
.mpanel a.on{color:#ffffff}
.mpanel a.mcv{margin-top:24px;align-self:flex-start;font-size:16px;font-weight:600;color:#74b9f0;border:1px solid rgba(116,185,240,.55);border-radius:999px;padding:12px 24px}
@media (max-width:860px){.nlinks{display:none!important}.mnav{display:block}}
.kicker+.sh,.kicker+h2{margin-top:8px}
.sh{font-size:36px;line-height:1.08;letter-spacing:-0.03em}
.ssub{font-size:17px;color:#93898e;margin:12px 0 0;max-width:720px}
@media (max-width:860px){.sh{font-size:30px}}
.lt{text-align:center}
.lt h2{font-size:42px;line-height:1.05}
.lt .ssub{margin:14px auto 0;max-width:620px;font-size:18px}
.lt .acts{display:flex;gap:26px;align-items:center;justify-content:center;margin-top:28px;flex-wrap:wrap}
.card,.ecard,.jcta,.do,.big,.small,.panel,.tkcol,.ccard,.bcard,.rcard,.feature,.slider,.stat{border-radius:24px!important}
.do,.small,.ccard{background:linear-gradient(180deg,#1f1a1d,#1a1619)!important;border:1px solid #2c262a}
.card:hover,.ecard:hover,.jcta:hover,.do:hover,.big:hover,.small:hover,.bcard:hover,.ccard:hover{transform:translateY(-4px)!important;border-color:rgba(116,185,240,.45)!important}
</style>

</head>
<body>
<div id="root"></div>
<script src="dc-runtime.js"></script>
<script src="assets.js"></script>
<script src="js/index.js"></script>
</body>
</html>
